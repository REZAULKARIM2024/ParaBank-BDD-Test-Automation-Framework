name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    name: API Suite (RestAssured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run API suite
        run: mvn test -DsuiteFile=testng-api.xml

      - name: Upload TestNG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-testng-report
          path: test-output/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: target/allure-results/

  accessibility-tests:
    name: Accessibility Suite (axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run accessibility suite (headless Chrome)
        run: mvn test -DsuiteFile=testng-accessibility.xml -Dheadless=true
        # ubuntu-latest ships Chrome pre-installed; WebDriverManager resolves the matching driver.

      - name: Upload TestNG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-testng-report
          path: test-output/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-allure-results
          path: target/allure-results/
